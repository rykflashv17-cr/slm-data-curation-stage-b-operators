version: 4
source_revision: 0e694dbc9706b2a5bac8e550f8cd9de18f5b7473
source_format: mcap
output_format: report_and_in_place_source_filter
quality_policy: reject_whole_mcap_on_any_bad_frame_or_stage_discard
dataset_profiles:
  - configs/jindian_marvin.yaml
  - configs/abc_130k.yaml
operators:
  - id: mcap_read
    name: MCAP读取
    class: stage_b_mcap_v4.operators.McapReadOperator
    input: McapEpisodeRef + McapSpec + quality config + dataset adapter
    output: QualityEpisode[state, action, frame_times_ns, startup_exclude, stage1_exclude, ref, source_identity]
  - id: global_stats
    name: 全局统计
    class: stage_b_mcap_v4.operators.GlobalStatsOperator
    input: readable and coverage-valid batch list[McapEpisodeRef] + McapSpec + quality config
    output: StatisticsBundle[Stage1 thresholds, Stage3 quantiles, alignment lag]
  - id: quality_detection
    name: 质量检测
    class: stage_b_mcap_v4.operators.QualityDetectionOperator
    input: QualityEpisode + McapSpec + quality config + StatisticsBundle
    output: whole-file quality decision + stage reasons + metrics + audit bad-frame ranges
    includes: [gripper_gap, stage1, stage2, stage3, stage4]
    methods:
      evaluate: run
      evaluate_coverage_before_statistics: precheck
      apply_recorded_rejections: delete_rejected
execution:
  stats: calculate_statistics_only
  quality_preflight: read_sources_then_quality_detection_gripper_precheck_before_statistics
  statistics_population_in_quality_or_run: selected_sources_that_are_readable_and_pass_gripper_precheck
  all_sources_rejected_by_gripper_gap: no_statistics_required
  required_statistics_failure: retain_entire_batch_without_deletion
  numeric_stage_scope: full_original_episode_without_prefix_truncation
  quality: write_decisions_without_deleting_sources
  run: write_all_batch_decisions_before_deleting_rejected_source_mcaps
  retain_input_errors: true
  disallow_symlink_deletion: true
  reencode_video: false
  export_new_mcap: false
