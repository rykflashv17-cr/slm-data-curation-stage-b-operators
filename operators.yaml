version: 2
source_repo: StridingAI/SLM_data_curation
source_revision: 48e1595
scope:
  pipeline_mode: clean
  input_format: pseudo_v3
  input_layout: single_root
  packages: discover_from_datasets_run_config_stage_b_yaml
  output_layouts: [pseudo_v3, aggregated_v3]
  excludes: [stage_a_align, raw_source_ingest]
operators:
  - id: config
    module: operators.config.ConfigOperator
    input: "upstream repo + dataset selector / Stage B YAML"
    output: "StageBDatasetSpec[package path, quality YAML path, fps, layout]"
    execution: cli
  - id: gate
    module: operators.gate.GateOperator
    input: "StageBDatasetSpec + review_checklist.yaml"
    output: "GateDecision[eef direction, manual review, extrinsic export]"
    execution: upstream_orchestrator_with_standalone_wrapper
  - id: discover
    module: operators.discover.DiscoverOperator
    input: "StageBDatasetSpec + Stage A pseudo_v3 root + selection"
    output: "list[EpisodeRef] + all-selected references for global statistics"
    execution: upstream_orchestrator_with_standalone_wrapper
  - id: statistics
    module: operators.statistics.StatisticsOperator
    input: "all selected episodes + dataset quality schema"
    output: "StatisticsBundle[Stage1 thresholds, Stage3 quantiles, lag, caches]"
    execution: v2_quality_pipeline
  - id: quality_input
    module: operators.input_adapter.InputOperator
    input: "Stage A episode Parquet + package adapter"
    output: "QualityEpisode[state[T,D], action[T,D], exclusion masks]"
    execution: v2_quality_pipeline
  - id: stage1
    module: operators.stage1.Stage1Operator
    input: "QualityEpisode + Stage1 global thresholds"
    output: "Stage1Result[abnormal frames, episode reasons, metrics]"
    execution: v2_quality_pipeline
  - id: stage2
    module: operators.stage2.Stage2Operator
    input: "QualityEpisode + state/action lag"
    output: "Stage2Result[alignment scores, reasons]"
    execution: v2_quality_pipeline
  - id: stage3
    module: operators.stage3.Stage3Operator
    input: "QualityEpisode + Stage3 global quantiles"
    output: "Stage3Result[extreme frames, reasons]"
    execution: v2_quality_pipeline
  - id: prefix
    module: operators.prefix.PrefixOperator
    input: "Stage1Result + Stage2Result + Stage3Result"
    output: "PrefixDecision[valid end, prefix mask, trigger]"
    execution: v2_quality_pipeline
  - id: stage4
    module: operators.stage4.Stage4Operator
    input: "QualityEpisode + PrefixDecision"
    output: "StaticDecision[static interval frame mask]"
    execution: v2_quality_pipeline
  - id: decision
    module: operators.decision.FinalDecisionOperator
    input: "QualityEpisode + stage decisions"
    output: "EpisodeResult[discard, final frame mask, reasons, audit]"
    execution: v2_quality_pipeline
  - id: quality
    module: operators.quality.QualityOperator
    input: "QualityEpisode + StatisticsBundle"
    output: "EpisodeResult; composes stage1, stage2, stage3, prefix, stage4, decision"
    execution: v2_quality_pipeline
  - id: aligned_episode
    module: operators.aligned.AlignedEpisodeOperator
    input: "Stage A episode reference + package adapter"
    output: "AlignedEpisode[StandardEpisode, quality arrays, source Parquet path]"
    execution: upstream_orchestrator_with_standalone_wrapper
  - id: report
    module: operators.report.ReportOperator
    input: "list[EpisodeResult] + statistics/config audit"
    output: "quality_report.json + exclusion_log.jsonl + optimal_lags.json"
    execution: v2_quality_pipeline
  - id: export
    module: operators.export.ExportOperator
    input: "dataset package + Stage B run config + Stage A pseudo_v3 root"
    output: "LeRobot shard[Parquet, videos, metadata, alignment audit]"
    execution: upstream_orchestrator_p7
  - id: aggregate
    module: operators.aggregate.AggregateOperator
    input: "one or more exported shards + package merge script"
    output: "renumbered final dataset + relative statistics + merge_report.json"
    execution: package_merge_script
conditional_upstream_stages:
  - id: stage5_frame_alignment
    enabled_by: "quality YAML stage5.enabled"
    note: "Delegated to upstream quality policy if enabled"
  - id: resolution_preflight
    enabled_by: "Stage B media resolution_unify settings"
    note: "Runs upstream census/plan before statistics when requested"
