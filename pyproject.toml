[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-b-mcap-operators-v3"
version = "0.1.0"
description = "Stage B quality operators for MCAP input and cleaned MCAP output"
requires-python = ">=3.10"
dependencies = [
  "mcap",
  "mcap-protobuf-support",
  "numpy",
  "PyYAML",
]

[project.scripts]
slm-stage-b-mcap = "stage_b_mcap_v3.cli:main"

[tool.setuptools.packages.find]
include = ["stage_b_mcap_v3*"]
